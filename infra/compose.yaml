services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hf
      POSTGRES_PASSWORD: hf
      POSTGRES_DB: hf
    ports: ["127.0.0.1:5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hf"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hfadmin
      MINIO_ROOT_PASSWORD: hfhfhfhf
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 hfadmin hfhfhfhf; do sleep 1; done;
      mc mb -p local/hf-photos;
      exit 0"
volumes:
  dbdata:
  miniodata:
