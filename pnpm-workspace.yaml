packages:
  - apps/*
  - packages/*

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - prisma
  # workerd ships the Workers runtime as a platform binary fetched by its
  # install script; without this the Cloudflare build and preview cannot run.
  - workerd
patchedDependencies:
  pg-cloudflare@1.4.0: patches/pg-cloudflare@1.4.0.patch
